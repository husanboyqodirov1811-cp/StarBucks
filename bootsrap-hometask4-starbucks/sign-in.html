<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="sign-in.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<body style="margin: 0;padding: 0;box-sizing: border-box;">
    <div class="container my-4 p-4 d-flex flex-column justify-content-center align-items-center"
        style="max-width: 400px;min-height: 700px;">
        <div class="row g-3">
            <div class="col-12 col-lg-12 text-center gap-3 d-flex flex-column">
                <div class="text fs-4 fw-bold d-flex flex-row justify-content-center align-items-center gap-1"><a class="text-black fs-6 text-decoration-none fw-bold" href="starbucks-home.html"><img src="images/download.png" style="max-width: 30px;min-height: 30px;" alt=""></a> Starbucks Coffee Company</div>
                <div class="text fs-4">Welcome Back</div>
                <div class="text fs-6">Description</div>
            </div>
            <div class="col-12 col-lg-12 d-flex flex-column gap-3">
                <div class="input d-flex  flex-column gap-2 px-3">
                    <input type="email" id="password" class="text-secondary"
                        style="border-radius: 10px; padding-left: 20px; box-sizing: border-box;width: 100%; max-width: 300px;height: 50px;"
                        placeholder="Email Adress*">
                    <input type="password" id="password" class="text-secondary"
                        style="border-radius: 10px; padding-left: 20px; box-sizing: border-box;width: 100%; max-width: 300px;height: 50px;"
                        placeholder="Password*"></div>
                <div class="text1 text-success fw-bold px-3">Forgot password?</div>
                <div class="input-text px-3">
                    <input type="checkbox" name="" id="">
                    <label for="">Keep me signed in.</label><label> Details
                        Checking this box will reduce the number of times you’re asked to sign in. To keep your account
                        secure, use this option only on your personal devices.</label>
                </div>
                <button type="button" class="btn btn-success rounded-pill" style="min-height: 50px;">Sign In</button>
                <div class="text d-flex flex-row gap-2 px-3">
                    <div class="text">Don't have account?</div>
                    <div class="text text-success fw-bold">Join now</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
